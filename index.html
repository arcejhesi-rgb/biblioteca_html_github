<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca Mallco Rancho</title>

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="login">

        <div class="caja">

            <div class="icono">
                <img src="unidade.jpg" alt="Biblioteca Mallco Rancho">
            </div>

            <h1>Biblioteca</h1>

            <h2>Mallco Rancho</h2>

            <p class="texto">
                Inicio de sesión
            </p>

            <input
                type="text"
                id="usuario"
                placeholder="Nombre de usuario"
            >

            <input
                type="password"
                id="contraseña"
                placeholder="Contraseña"
            >

            <button onclick="iniciarSesion()">
                Ingresar
            </button>

            <p id="mensaje"></p>

            <p class="escuela">
                Unidad Educativa Mallco Rancho
            </p>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
